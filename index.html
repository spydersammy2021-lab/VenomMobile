<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venom Mobile | Professional Speedtest</title>
    <style>
        :root {
            --primary-color: #00ff41;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: radial-gradient(circle at center, #1a1a2e 0%, #020205 100%);
            font-family: 'Inter', system-ui, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Animowane tło w stylu płynnego ognia/energii */
        body::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, var(--primary-color), transparent 30%);
            animation: rotate 10s linear infinite;
            opacity: 0.05;
            z-index: -1;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        /* Szklany Header */
        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            animation: fadeInDown 0.8s ease-out;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-dot {
            width: 12px;
            height: 12px;
            background: var(--primary-color);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--primary-color);
            animation: pulse 2s infinite;
        }

        /* Efekt Płynnego Szkła dla Testu */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            perspective: 1000px;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 10px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: slideUp 1s cubic-bezier(0.17, 0.67, 0.83, 0.67);
            width: 95vw;
            max-width: 1200px;
            height: 80vh;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 20px;
        }

        /* Animacje */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px) rotateX(10deg); }
            to { opacity: 1; transform: translateY(0) rotateX(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        .status-badge {
            background: rgba(0, 255, 65, 0.1);
            color: var(--primary-color);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid var(--primary-color);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <div class="logo-dot"></div>
            VENOM<span style="font-weight: 300; color: #ccc;">MOBILE</span>
        </div>
        <div class="status-badge">LIVE NETWORK TEST</div>
    </header>

    <main class="main-container">
        <div class="glass-panel">
            <iframe 
                src="https://venom-mobile.fireprobe.net" 
                allow="geolocation"
                scrolling="no">
            </iframe>
        </div>
    </main>

</body>
</html>
