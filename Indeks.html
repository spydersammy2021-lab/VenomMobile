<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Venom Mobile Premium</title>
    <style>
        :root {
            --ios-red: #ff3b30;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            margin: 0;
            background: #000 url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Blur tła pod całą aplikacją */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: -1;
        }

        header {
            padding: 40px 20px 20px;
            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .logo span { color: var(--ios-red); }

        .main-container {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Szklany Panel iOS */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            width: 100%;
            max-width: 350px;
            padding: 40px 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            text-align: center;
        }

        /* Licznik prędkości */
        .speed-display {
            margin-bottom: 40px;
        }

        .speed-number {
            font-size: 80px;
            font-weight: 200;
            line-height: 1;
            margin: 0;
            letter-spacing: -2px;
        }

        .speed-unit {
            color: var(--ios-red);
            font-weight: 600;
            font-size: 18px;
            margin-top: 5px;
            letter-spacing: 2px;
        }

        /* Statystyki Download/Upload */
        .stats-grid {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid var(--glass-border);
            padding-top: 30px;
        }

        .stat-item .label {
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-item .value {
            font-size: 20px;
            font-weight: 600;
        }

        .stat-item .unit {
            font-size: 12px;
            color: var(--ios-red);
        }

        /* Dolny pasek */
        footer {
            padding: 30px;
            text-align: center;
        }

        .tagline {
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(to right, #fff, var(--ios-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span>V</span>enom Mobile</div>
    </header>

    <div class="main-container">
        <div class="glass-card">
            <div class="speed-display">
                <p class="speed-number">1000</p>
                <p class="speed-unit">MBPS</p>
            </div>

            <div class="stats-grid">
                <div class="stat-item">
                    <div class="label">Pobieranie</div>
                    <div class="value">1000<span class="unit">.0</span></div>
                </div>
                <div style="width: 1px; background: var(--glass-border);"></div>
                <div class="stat-item">
                    <div class="label">Wysyłanie</div>
                    <div class="value">300<span class="unit">.0</span></div>
                </div>
            </div>
        </div>
        
        <div style="margin-top: 30px; color: rgba(255,255,255,0.6); font-size: 14px;">
            Sieć: <strong>Venom Ultra 5G+</strong>
        </div>
    </div>

    <footer>
        <div class="tagline">Venom numerem 1 w Polsce</div>
    </footer>

</body>
</html>
