<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venom Mobile - Speedtest</title>
    <style>
        :root { --venom-red: #ff0000; --glass: rgba(255, 255, 255, 0.07); }
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        
        /* Header */
        header { height: 60px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid #222; }
        .logo { font-weight: 900; font-size: 22px; letter-spacing: -1px; }
        .logo span { color: var(--venom-red); }

        /* Główne okno testera */
        .app-container {
            height: calc(100vh - 150px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #2b0000 0%, #000 100%);
        }

        /* Wielki pierścień postępu */
        .speed-ring {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 8px solid #111;
            border-top: 8px solid var(--venom-red);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.2);
            animation: spin 2s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .speed-value {
            transform: rotate(-360deg); /* Odkręcenie tekstu, żeby stał prosto */
            animation: counter-spin 2s linear infinite;
            text-align: center;
        }
        
        @keyframes counter-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }

        /* Sekcja wyników - to o co prosiłeś */
        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 90%;
            margin-top: 40px;
        }

        .result-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid rgba(255,0,0,0.2);
            text-align: center;
        }

        .label { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        .value { font-size: 24px; font-weight: bold; color: #fff; }
        .unit { font-size: 14px; color: var(--venom-red); }

        /* Footer */
        footer { position: fixed; bottom: 0; width: 100%; padding: 20px; background: #000; text-align: center; border-top: 1px solid #222; }
        .status { color: #00ff00; font-size: 12px; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .dot { width: 8px; height: 8px; background: #00ff00; border-radius: 50%; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span>V</span>ENOM MOBILE</div>
    </header>

    <div class="app-container">
        <div class="speed-ring">
            <div class="speed-value">
                <div style="font-size: 48px; font-weight: 900;">1000</div>
                <div style="color: var(--venom-red); font-weight: bold;">Mb/s</div>
            </div>
        </div>

        <div class="results-grid">
            <div class="result-card">
                <div class="label">Pobieranie</div>
                <div class="value">1000.0 <span class="unit">Mb/s</span></div>
            </div>
            <div class="result-card">
                <div class="label">Wysyłanie</div>
                <div class="value">300.0 <span class="unit">Mb/s</span></div>
            </div>
        </div>
    </div>

    <footer>
        <div class="status"><div class="dot"></div> Sieć Venom 5G Ultra działa poprawnie</div>
        <div style="font-size: 20px; font-weight: bold;">Venom <span style="color: var(--venom-red);">numerem 1</span></div>
    </footer>

</body>
</html>
