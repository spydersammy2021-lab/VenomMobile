<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Venom Mobile Speedtest</title>
    <style>
        :root {
            --v-red: #ff0000;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            background: #000;
            /* Gradient tła nadający głębię pod szkło */
            background: radial-gradient(circle at center, #220000 0%, #000 100%);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Górny pasek Venom */
        header {
            padding: 25px 20px;
            text-align: center;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .brand {
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .brand span { color: var(--v-red); }

        /* Kontener główny - "Płynne Szkło" */
        .glass-wrapper {
            flex: 1;
            margin: 15px;
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* Ukrywanie góry i dołu Fireprobe, by został sam licznik */
        .iframe-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            /* Lekkie przyciemnienie samej ramki, by pasowała do czarnego tła */
            background-color: transparent;
        }

        /* Dolny baner jak w T-Mobile/Orange */
        footer {
            padding: 20px;
            text-align: center;
            background: rgba(0,0,0,0.8);
        }

        .promo {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .promo span { color: var(--v-red); }
        
        .sub-text {
            font-size: 10px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand"><span>V</span>ENOM MOBILE</div>
    </header>

    <main class="glass-wrapper">
        <div class="iframe-container">
            <iframe 
                src="https://venom-mobile.fireprobe.net" 
                scrolling="no">
            </iframe>
        </div>
    </main>

    <footer>
        <div class="promo">Venom <span>numerem 1</span></div>
        <div class="sub-text">Najszybsza sieć 5G Ultra w Polsce</div>
    </footer>

</body>
</html>
