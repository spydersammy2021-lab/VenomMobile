<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Venom Mobile - Speedtest Premium</title>
    <style>
        :root {
            --v-red: #ff0000;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        body {
            margin: 0;
            padding: 0;
            background: #000;
            /* Głęboki gradient w stylu Apple/T-Mobile */
            background: radial-gradient(circle at top, #330000 0%, #000000 100%);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header z Twoim brandingiem */
        header {
            padding: 35px 20px 15px;
            text-align: center;
        }

        .brand {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .brand span { color: var(--v-red); }

        /* Główny kontener na "Płynne Szkło" */
        .glass-container {
            flex: 1;
            margin: 10px 15px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Ramka z prawdziwym silnikiem */
        .iframe-wrapper {
            flex: 1;
            width: 100%;
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            /* Dzięki temu tester wtapia się w czarne tło */
            background-color: transparent;
        }

        /* Stopka w stylu operatora */
        footer {
            padding-bottom: 30px;
            text-align: center;
        }

        .promo-line {
            font-size: 22px;
            font-weight: 800;
            margin: 0;
        }

        .promo-line span {
            color: var(--v-red);
        }

        .tech-info {
            font-size: 10px;
            color: #555;
            text-transform: uppercase;
            margin-top: 8px;
            letter-spacing: 1.5px;
        }

        /* Dekoracyjny blask pod szkłem */
        .glow {
            position: absolute;
            width: 150px;
            height: 150px;
            background: var(--v-red);
            filter: blur(80px);
            opacity: 0.2;
            z-index: -1;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand"><span>V</span>ENOM MOBILE</div>
    </header>

    <main class="glass-container">
        <div class="glow"></div>
        <div class="iframe-wrapper">
            <iframe 
                src="https://venom-mobile.fireprobe.net" 
                scrolling="no">
            </iframe>
        </div>
    </main>

    <footer>
        <p class="promo-line">Venom <span>numerem 1</span></p>
        <div class="tech-info">Najszybsza sieć 5G Ultra w Polsce &copy; 2026</div>
    </footer>

</body>
</html>
