<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venom Mobile - Real Speed</title>
    <script src="https://librespeed.org/librespeed.js"></script>
    <style>
        :root { --v-red: #ff0000; --glass: rgba(255, 255, 255, 0.1); }
        body { 
            margin: 0; background: #000; color: #fff; 
            font-family: -apple-system, sans-serif;
            height: 100vh; display: flex; flex-direction: column;
            background: linear-gradient(135deg, #000 0%, #1a0000 100%);
        }

        header { padding: 30px; text-align: center; }
        .logo { font-size: 26px; font-weight: 900; letter-spacing: 1px; }
        .logo span { color: var(--v-red); }

        .container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }

        /* iOS Glassmorphism Card */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px;
            width: 100%; max-width: 340px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .speed-val { font-size: 70px; font-weight: 200; margin: 0; }
        .unit { color: var(--v-red); font-weight: bold; font-size: 14px; letter-spacing: 2px; }

        /* Przycisk START */
        .btn-start {
            margin-top: 30px;
            background: var(--v-red);
            color: white; border: none;
            padding: 15px 50px; border-radius: 30px;
            font-weight: bold; font-size: 18px;
            box-shadow: 0 0 20px rgba(255,0,0,0.4);
            cursor: pointer;
        }

        .stats { display: flex; justify-content: space-around; margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; }
        .stat-box .label { font-size: 10px; color: #888; text-transform: uppercase; }
        .stat-box .value { font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span>V</span>ENOM MOBILE</div>
    </header>

    <div class="container">
        <div class="glass-card">
            <div id="status" style="font-size: 12px; color: #888; margin-bottom: 10px;">Gotowy do testu</div>
            <p class="speed-val" id="dlText">0</p>
            <p class="unit">MBPS DOWNLOAD</p>

            <div class="stats">
                <div class="stat-box">
                    <div class="label">Upload</div>
                    <div class="value" id="ulText">0</div>
                </div>
                <div class="stat-box">
                    <div class="label">Ping</div>
                    <div class="value" id="pingText">0</div>
                </div>
            </div>

            <button class="btn-start" onclick="startTest()">START</button>
        </div>
    </div>

    <footer style="padding: 20px; text-align: center;">
        <div style="font-weight: bold; font-size: 18px;">Venom <span>numerem 1</span></div>
    </footer>

    <script>
        // Konfiguracja silnika pomiarowego
        var s = new Librespeed();
        s.onupdate = function(data) {
            document.getElementById('dlText').textContent = data.dlStatus || "0";
            document.getElementById('ulText').textContent = data.ulStatus || "0";
            document.getElementById('pingText').textContent = data.pingStatus || "0";
        };
        s.onend = function(aborted) {
            document.getElementById('status').textContent = aborted ? "Przerwano" : "Test zakończony";
        };

        function startTest() {
            document.getElementById('status').textContent = "Testowanie...";
            s.start();
        }
    </script>
</body>
</html>
