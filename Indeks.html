<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venom Mobile - Speedtest</title>
    <style>
        :root {
            --v-red: #ff0000;
            --v-dark: #0a0a0a;
            --v-glass: rgba(255, 0, 0, 0.05);
        }

        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Branding Top */
        header {
            padding: 25px 20px;
            display: flex;
            justify-content: center;
            background: linear-gradient(to bottom, #111, #000);
        }

        .brand {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .brand span { color: var(--v-red); }

        /* Główne Centrum Wyników */
        .dashboard {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            padding: 20px;
        }

        /* Nowoczesny licznik kołowy */
        .gauge-container {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gauge-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #222;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.15);
        }

        .gauge-progress {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top: 4px solid var(--v-red);
            border-right: 4px solid var(--v-red);
            animation: pulse 1.5s ease-in-out infinite;
        }

        .main-speed { text-align: center; z-index: 2; }
        .main-speed h1 { font-size: 64px; margin: 0; font-weight: 900; }
        .main-speed p { color: var(--v-red); margin: 0; font-weight: bold; letter-spacing: 3px; }

        /* Panel Statystyk */
        .stats-row {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        .stat-card {
            flex: 1;
            background: var(--v-glass);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px 10px;
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .stat-card .label { font-size: 11px; color: #777; text-transform: uppercase; margin-bottom: 8px; }
        .stat-card .val { font-size: 22px; font-weight: bold; }
        .stat-card .unit { color: var(--v-red); font-size: 12px; }

        /* Footer */
        footer {
            padding: 30px;
            text-align: center;
            background: var(--v-dark);
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            border: 1px solid rgba(255, 0, 0, 0.2);
        }

        .best-label { font-size: 20px; font-weight: bold; }
        .best-label span { color: var(--v-red); }

        @keyframes pulse {
            0% { transform: rotate(0deg); opacity: 0.8; }
            50% { transform: rotate(180deg); opacity: 1; }
            100% { transform: rotate(360deg); opacity: 0.8; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand"><span>V</span>ENOM MOBILE</div>
    </header>

    <div class="dashboard">
        <div class="gauge-container">
            <div class="gauge-ring"></div>
            <div class="gauge-progress"></div>
            <div class="main-speed">
                <h1>1000</h1>
                <p>MB/S</p>
            </div>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="label">Download</div>
                <div class="val">1000.0</div>
                <div class="unit">Mb/s</div>
            </div>
            <div class="stat-card">
                <div class="label">Upload</div>
                <div class="val">300.0</div>
                <div class="unit">Mb/s</div>
            </div>
        </div>
        
        <div class="stats-row">
            <div class="stat-card" style="padding: 10px;">
                <span style="color:#00ff00; font-size: 12px;">● Ping: 2ms</span>
            </div>
            <div class="stat-card" style="padding: 10px;">
                <span style="color:#fff; font-size: 12px;">Sieć: Venom 5G+</span>
            </div>
        </div>
    </div>

    <footer>
        <div class="best-label">Venom <span>numerem 1</span> w Polsce</div>
        <div style="font-size: 10px; color: #444; margin-top: 8px;">TECHNOLOGIA ULTRA-BROADBAND 2026</div>
    </footer>

</body>
</html>
