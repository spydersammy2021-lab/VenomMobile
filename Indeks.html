<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venom Mobile - Speedtest</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Górny pasek w stylu operatora */
        header {
            height: 60px;
            background: #000;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #333;
            justify-content: space-between;
        }

        .logo {
            font-weight: 900;
            font-size: 20px;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .logo span {
            color: #ff0000; /* Czerwień Venom */
        }

        /* Kontener główny */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1a0000 0%, #000 100%);
        }

        /* Stylizacja ramki testera */
        .tester-container {
            width: 95%;
            max-width: 500px;
            height: 80vh;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.1);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            /* Ukrywamy białe błyski podczas ładowania */
            background-color: #000;
        }

        /* Dolny baner jak w T-Mobile */
        footer {
            background: #000;
            padding: 20px;
            text-align: center;
            border-top: 1px solid #222;
        }

        .promo-text {
            font-size: 24px;
            font-weight: bold;
            margin: 0;
        }

        .promo-text span {
            color: #ff0000;
        }

        /* Przycisk pływający (jak słuchawka na zdjęciu) */
        .fab {
            position: fixed;
            bottom: 80px;
            left: 20px;
            width: 60px;
            height: 60px;
            background: #ff0000;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span>V</span>ENOM MOBILE</div>
        <div style="color: #666;">☰</div>
    </header>

    <main>
        <div class="tester-container">
            <iframe src="https://venom-mobile.fireprobe.net" scrolling="no"></iframe>
        </div>
    </main>

    <div class="fab">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="white">
            <path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
        </svg>
    </div>

    <footer>
        <p class="promo-text">Venom <span>numerem 1</span></p>
        <p style="font-size: 10px; color: #444; margin-top: 5px;">Według testów prędkości 2026</p>
    </footer>

</body>
</html>
